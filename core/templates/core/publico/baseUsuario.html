{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Alerta AMBER - Prototipo{% endblock %}</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">

    <link rel="stylesheet" href="{% static 'base.css' %}" />
    <link rel="stylesheet" href="{% static 'estilos_public.css' %}" />

</head>
<body>
    <header class="site-header">
        <h1>Alerta AMBER Panamá - Sitio Oficial</h1>
        <nav class="site-nav">
            <div class="nav-links">
                <a href="{% url 'inicio' %}">Inicio</a>
                <a href="{% url 'lista_alertas' %}">Casos Reportados</a>
                <button type="button" id="activarNotificaciones" class="btn-activar-alertas" hidden>Activar alertas</button>
            </div>
        </nav>
    </header>
    <hr class="franja-bandera" />

    <main>
        {% block content %}
       
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>© 2025 Alerta AMBER Panamá</p>
    </footer>
<script>
const publicKey = '{{ VAPID_PUBLIC_KEY }}';
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const btnActivar = document.getElementById('activarNotificaciones');

function urlB64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
    const rawData = window.atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

function bufferToBase64(buffer) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
}

function mostrarEstadoBoton(estado) {
    if (!btnActivar) return;
    btnActivar.hidden = false;
    if (estado === 'activo') {
        btnActivar.textContent = 'Alertas activadas';
        btnActivar.disabled = true;
    } else if (estado === 'bloqueado') {
        btnActivar.textContent = 'Alertas bloqueadas en el navegador';
        btnActivar.disabled = true;
    } else {
        btnActivar.textContent = 'Activar alertas';
        btnActivar.disabled = false;
    }
}

function enviarSuscripcion(subscription) {
    return fetch('/save-subscription/', {
        method: 'POST',
        body: JSON.stringify({
            endpoint: subscription.endpoint,
            keys: {
                auth: bufferToBase64(subscription.getKey('auth')),
                p256dh: bufferToBase64(subscription.getKey('p256dh'))
            }
        }),
        headers: {'Content-Type': 'application/json'}
    }).then(res => res.json());
}

function subscribeUser(registration) {
    return registration.pushManager.getSubscription()
        .then(subscription => subscription || registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8Array(publicKey)
        }))
        // Siempre se reenvía: el servidor deduplica por endpoint
        .then(enviarSuscripcion)
        .then(data => {
            console.log('Suscripción guardada:', data);
            mostrarEstadoBoton('activo');
        });
}

function activarAlertas() {
    // Se invoca solo desde un clic del usuario (gesto requerido para pedir permiso)
    return Notification.requestPermission().then(permission => {
        if (permission !== 'granted') {
            mostrarEstadoBoton(permission === 'denied' ? 'bloqueado' : 'inactivo');
            return;
        }
        return navigator.serviceWorker.register('/service-worker.js')
            .then(() => navigator.serviceWorker.ready)
            .then(subscribeUser);
    }).catch(err => console.error('Error activando alertas:', err));
}

document.addEventListener('DOMContentLoaded', () => {
    if (!pushSupported) {
        if (btnActivar) btnActivar.hidden = true;
        return;
    }
    if (Notification.permission === 'denied') {
        mostrarEstadoBoton('bloqueado');
    } else if (Notification.permission === 'granted') {
        // Permiso ya concedido antes: se refresca la suscripción sin pedir nada
        mostrarEstadoBoton('activo');
        navigator.serviceWorker.register('/service-worker.js')
            .then(() => navigator.serviceWorker.ready)
            .then(subscribeUser)
            .catch(err => console.error('Error renovando suscripción:', err));
    } else {
        mostrarEstadoBoton('inactivo');
    }
    if (btnActivar) {
        btnActivar.addEventListener('click', activarAlertas);
    }
});
</script>
</body>
</html>
